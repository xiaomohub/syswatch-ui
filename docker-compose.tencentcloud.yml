# 腾讯云 Docker / 部分编排控制台：避免使用 restart: no（易被拒）。
# 不写 restart 时，行为与 restart: no 一致（容器退出后不自动拉起）。
# 需要常驻的服务保留 unless-stopped。
#
# 使用: docker compose -f docker-compose.tencentcloud.yml up -d
# 需 3.4+ 以支持 depends_on + condition（健康检查）
version: '3.8'

services:
  mysql1:
    image: mysql:8.0
    container_name: mysql1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb1
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/mysql1/my.cnf:/etc/mysql/my.cnf
      - mysql1_data:/var/lib/mysql
      - ./mysql/mysql2/init-exporter.sql:/docker-entrypoint-initdb.d/init-exporter.sql

  mysql2:
    image: mysql:8.0
    container_name: mysql2
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testdb2
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/mysql2/my.cnf:/etc/mysql/my.cnf
      - mysql2_data:/var/lib/mysql
      - ./mysql/mysql2/init-exporter.sql:/docker-entrypoint-initdb.d/init-exporter.sql

  redis1:
    image: redis:7.0
    container_name: redis1
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis1/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis2:
    image: redis:7.0
    container_name: redis2
    ports:
      - "6380:6379"
    volumes:
      - ./redis/redis2/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    profiles: ["redis2"]

  zookeeper1:
    image: zookeeper:3.8.4
    container_name: zookeeper1
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
      ZOO_TICK_TIME: 2000
      ZOO_STANDALONE_ENABLED: "true"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      zookeeper1:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka1:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - /root/docker-services/alertmanager:/etc/alertmanager
    ports:
      - "9094:9093"
    restart: unless-stopped

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    environment:
      TZ: Asia/Shanghai
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql1:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job_user
        --spring.datasource.password=xxl123456
        --xxl.job.prometheus.enabled=true
        --management.endpoints.web.exposure.include=prometheus
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      - mysql1
    profiles: ["xxl-job"]

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"

  mysqld_exporter1:
    image: prom/mysqld-exporter
    container_name: mysqld_exporter1
    command: ["--config.my-cnf=/etc/.my.cnf"]
    volumes:
      - ./mysql/mysql1/client.cnf:/etc/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      - mysql1

  mysqld_exporter2:
    image: prom/mysqld-exporter
    container_name: mysqld_exporter2
    command: ["--config.my-cnf=/etc/.my.cnf"]
    volumes:
      - ./mysql/mysql2/client.cnf:/etc/.my.cnf:ro
    ports:
      - "9105:9104"
    depends_on:
      - mysql2

  redis_exporter1:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter1
    environment:
      REDIS_ADDR: "redis1:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis1

  redis_exporter2:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter2
    environment:
      REDIS_ADDR: "redis2:6379"
    ports:
      - "9122:9121"
    depends_on:
      - redis2
    profiles: ["redis2"]

  kafka_exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka_exporter
    command:
      - '--kafka.server=kafka1:9092'
    ports:
      - "9308:9308"
    depends_on:
      kafka1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus/rules:/etc/prometheus/rules
    ports:
      - "9099:9090"
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --web.enable-lifecycle

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin123"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    depends_on:
      - prometheus

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_pass
      POSTGRES_DB: testdb
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:pg_pass@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  docker_stats_exporter:
    image: gregmika/docker_stats_exporter:v0.1
    container_name: docker_stats_exporter
    ports:
      - "9323:9273"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command: -nginx.scrape-uri http://nginx:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx

volumes:
  mysql1_data:
  mysql2_data:
  grafana_data:
  zookeeper_data:
  zookeeper_datalog:
  postgres_data:
